# Independent Workouts site; leave the Recipes site's configuration unchanged.
[build]
  base = "workouts-web"
  command = "npm ci && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22.22.3"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/shared*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
[[redirects]]
  from = "/shared/*"
  to = "/shared/index.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
