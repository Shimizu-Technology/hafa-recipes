services:
  - type: web
    name: recipe-api
    runtime: python
    rootDir: api
    branch: main
    # Deploy main only after its checks pass. CI runs only the checks for the
    # surfaces a commit changes, so API deploys wait on the API checks.
    # Render skips a commit with no checks, so .github/workflows/ci.yml must
    # keep api/** in its paths.
    autoDeployTrigger: checksPass
    # Only API changes redeploy the API. Before this filter, every app's merge
    # restarted it and could interrupt imports in progress.
    buildFilter:
      paths:
        - api/**
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Existing production schema is verified at startup. Apply new migrations
    # separately after a recovery point; never replay historical data repairs.
    preDeployCommand: python -m app.grocery_membership_repair
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /up
    envVars:
      # A record of what production runs, not what sets it: the live service
      # isn't on a Blueprint, so each flag is changed on the service itself.
      # Never turn BABY_FAMILY_ENABLED off once a family exists. Roll back with
      # BABY_INVITES_ENABLED. See the R1 runbook.
      - key: BABY_FAMILY_ENABLED
        value: "true"
      - key: BABY_INVITES_ENABLED
        value: "true"
