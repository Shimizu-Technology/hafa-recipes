services:
  - type: web
    name: recipe-api
    runtime: python
    rootDir: api
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Existing production schema is verified at startup. Apply new migrations
    # separately after a recovery point; never replay historical data repairs.
    preDeployCommand: python -m app.grocery_membership_repair
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /up
