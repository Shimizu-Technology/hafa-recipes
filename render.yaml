services:
  - type: web
    name: recipe-api
    runtime: python
    rootDir: api
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: >-
      python -m migrations.016_add_stable_clerk_identities &&
      python -m migrations.017_add_clerk_migration_grants &&
      python -m migrations.018_add_durable_extraction_jobs &&
      python -m migrations.019_add_durable_deletion_cleanup &&
      python -m migrations.020_add_database_invariants &&
      python -m migrations.021_add_ai_invocation_provenance
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /up
