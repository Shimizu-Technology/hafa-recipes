[build]
  ignore = "bash scripts/netlify-ignore-build.sh"
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"

# Preview builds serve a local 404 instead of sending recipe URLs to production.
[context.deploy-preview]
  command = "npm run build && cp preview-redirects dist/_redirects"

[context.branch-deploy]
  command = "npm run build && cp preview-redirects dist/_redirects"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Serve this extensionless JSON file directly, ahead of the SPA catch-all.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Demo page shared into the app for App Store screenshots; never indexed.
[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Keep authorization and OG rendering in the API. Do not cache revocable links.
[[headers]]
  for = "/r/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/r/*"
  to = "https://recipe-api-x5na.onrender.com/public/r/:splat"
  status = 200
  force = true
  signed = "RECIPE_PROXY_SECRET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
