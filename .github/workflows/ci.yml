name: API

# Each surface deploys independently. Run its checks only when it changes,
# so an unrelated surface's failing check cannot hold back this one's
# deploy. Render deploys the API from main only after checks pass.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - api/**
      - render.yaml
      # API tests also read these files.
      - infra/**
      - scripts/setup-dev.sh
      - .github/workflows/import-health.yml
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - api/**
      - render.yaml
      # API tests also read these files.
      - infra/**
      - scripts/setup-dev.sh
      - .github/workflows/import-health.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  api:
    name: FastAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hafa_recipes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hafa_recipes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hafa_recipes_test
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Check deployed requirements match uv.lock
        # Render installs requirements.txt; CI tests uv.lock. They must agree.
        run: python scripts/check_requirements_lock.py

      - name: Lint
        run: uv run ruff check app migrations tests

      - name: Test
        run: uv run pytest
