name: Recipes mobile

# Runs only when this surface changes; see ci.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - mobile/**
      - .github/workflows/mobile.yml
  push:
    branches: [main]
    paths:
      - mobile/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

jobs:
  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test migration bridge
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Check Expo dependency health
        run: npm run doctor

      - name: Audit production dependency changes
        run: npm run audit:runtime
